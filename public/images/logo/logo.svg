<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F5D88A" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Aperture Emblem -->
  <g transform="translate(80, 80)">
    <!-- Outer concentric gold rings -->
    <circle cx="0" cy="0" r="54" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    <circle cx="0" cy="0" r="50" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="44" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8" />
    
    <!-- Shutter Blades (Aperture) -->
    <path d="M-40 -10 Q-15 -35 0 -44 Q15 -30 25 -15" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M25 -15 Q40 5 44 20 Q20 35 5 44" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M5 44 Q-20 40 -35 25 Q-40 0 -40 -10" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- Central Monogram: N K -->
    <text x="-2" y="11" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">NK</text>
    
    <!-- Micro golden focal points -->
    <circle cx="0" cy="-44" r="2" fill="#FFF2B2" />
    <circle cx="44" cy="0" r="2" fill="#FFF2B2" />
    <circle cx="0" cy="44" r="2" fill="#FFF2B2" />
    <circle cx="-44" cy="0" r="2" fill="#FFF2B2" />
  </g>

  <!-- Typography: NK GABRU PHOTOGRAPHY -->
  <!-- Top brand word -->
  <text x="160" y="70" font-family="'Cinzel', 'Playfair Display', serif" font-size="36" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">NK GABRU</text>
  
  <!-- Subheading: PHOTOGRAPHY -->
  <text x="162" y="98" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#F5F2EA" letter-spacing="12">PHOTOGRAPHY</text>

  <!-- Tagline divider -->
  <line x1="162" y1="112" x2="520" y2="112" stroke="url(#goldLight)" stroke-width="1.2" />

  <!-- Tagline: CAPTURE • CREATE • CHERISH -->
  <text x="162" y="128" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="400" fill="#D4AF37" letter-spacing="5">CAPTURE  •  CREATE  •  CHERISH</text>
</svg>
